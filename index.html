<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥬</text></svg>"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Source+Serif+4:ital,wght@0,400..600;1,400&display=swap"><link rel="stylesheet" href="global.css"><title>Kale · Guide to IB Rubrics</title></head>
<body data-page="login">
<div class="auth">
 <section class="hero">
  <h1>Read a rubric like your teacher does.</h1>
  <p>Short, interactive guides that show IB MYP students what each band, strand and command term is really asking for.</p>
  <div class="rubric" aria-hidden="true"><div><b>1–2</b>Beginning, limited</div><div><b>3–4</b>Developing</div><div><b>5–6</b>Strong</div><div class="top"><b>7–8</b><span>Excellent</span></div></div>
 </section>
 <section>
  <form id="auth" novalidate>
   <div class="tabs" role="tablist"><button type="button" class="tab" data-m="in" role="tab" aria-selected="true">Sign in</button><button type="button" class="tab" data-m="up" role="tab" aria-selected="false">Create account</button></div>
   <label>Email<input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
   <label>Password<input name="pw" type="password" autocomplete="current-password" required></label>
   <p id="hint" class="mute" hidden>Use at least 8 characters.</p>
   <label class="check" id="keepw"><input name="keep" type="checkbox" checked> Keep me signed in</label>
   <p id="msg" class="err" role="alert"></p>
   <button class="btn" id="go">Sign in</button>
   <p class="alt mute">Just looking? <button type="button" class="link" id="guest">Try it as a guest</button></p>
  </form>
 </section>
</div>
<script src="js/content.js"></script><script src="js/app.js"></script>
</body></html>
